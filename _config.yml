# Site Configuration for Bang Mansur
title: "Bang Mansur"
tagline: "Cybersecurity Practitioner, Network Infrastructure & SRE Specialist"
description: "Catatan rekayasa sistem, riset keamanan siber zero-leak, optimasi QoS MikroTik, arsitektur Proxmox homelab, dan portal utilitas teknis Bang Mansur."
url: "https://xyz-sur.github.io"
baseurl: ""

# Author Profile
author:
  name: "Bang Mansur"
  username: "mansur"
  email: "mansyurj168@gmail.com"
  bio: "Cybersecurity Practitioner & Computer Science Master's (S2) Student. Fokus pada arsitektur Zero-Leak, rekayasa jaringan korporat, virtualisasi Proxmox, dan otomasi bot cerdas."
  avatar: "https://github.com/xyz-sur.png"
  status: "available"
  github: "https://github.com/xyz-sur"
  telegram: "https://t.me/premium2inn"
  portfolio: "https://xsur.my.id"

# Localization & Timezone
lang: id
timezone: Asia/Jakarta

# Markdown & Syntax Highlighter
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Permalinks for blog posts
permalink: /posts/:title/

# Collections & Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

# Exclude files from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor/
  - .devcontainer/
  - .vscode/
