<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64 & URL Encoder / Decoder | Bang Mansur Tools</title>
  <meta name="description" content="Alat konversi dua arah teks dan string ke Base64 serta URL Encoding/Decoding aman 100% di browser.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #090c12;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .card-tool {
      background-color: #121824;
      border: 1px solid #1f293d;
      border-radius: 1rem;
    }
    .form-control {
      background-color: #090c12;
      border: 1px solid #2d3748;
      color: #00f2fe;
      font-family: "Fira Code", monospace;
    }
    .form-control:focus {
      background-color: #090c12;
      border-color: #00f2fe;
      color: #00f2fe;
      box-shadow: 0 0 0 0.25rem rgba(0, 242, 254, 0.25);
    }
    .font-mono {
      font-family: "Fira Code", monospace;
    }
  </style>
</head>
<body class="py-4">
  <div class="container" style="max-width: 860px;">
    <!-- Navigation Bar: Interconnected across Blog, Portfolio, and Tools -->
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4 pb-2 border-bottom border-secondary border-opacity-25">
      <div class="d-flex align-items-center gap-2">
        <a href="/" class="btn btn-outline-secondary btn-sm rounded-pill text-light" title="Kembali ke Beranda Blog">
          <i class="fas fa-home me-1"></i> Home / Blog
        </a>
        <a href="/portofolio/" class="btn btn-outline-info btn-sm rounded-pill" title="Buka Portofolio Layanan IT">
          <i class="fas fa-briefcase me-1"></i> Portofolio
        </a>
        <a href="/tools/" class="btn btn-outline-primary btn-sm rounded-pill" title="Katalog Semua Alat (Mansur IT Tools)">
          <i class="fas fa-toolbox me-1"></i> Hub Tools
        </a>
      </div>
      <span class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 px-3 py-2 rounded-pill font-mono">
        <i class="fas fa-code me-1"></i> Web Dev Base64 Engine
      </span>
    </div>

    <!-- Main Card -->
    <div class="card card-tool p-4 shadow-lg mb-4">
      <div class="d-flex align-items-center gap-3 mb-3">
        <div class="p-3 bg-info bg-opacity-10 text-info rounded-3 border border-info border-opacity-25">
          <i class="fas fa-exchange-alt fa-2x"></i>
        </div>
        <div>
          <h4 class="fw-bold mb-1 text-light font-mono">Base64 & URL Encoder / Decoder</h4>
          <p class="text-muted small mb-0">Enkripsi dan dekripsi dua arah teks biasa, string token, atau payload API langsung di memori browser.</p>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label text-light small font-mono">Input Teks / Payload:</label>
        <textarea id="inputText" class="form-control font-mono" rows="4" placeholder="Ketik atau tempel teks di sini..."></textarea>
      </div>

      <div class="d-flex flex-wrap gap-2 mb-4">
        <button class="btn btn-success font-mono rounded-pill px-3" onclick="encodeBase64()">
          <i class="fas fa-lock me-1"></i> Encode Base64
        </button>
        <button class="btn btn-primary font-mono rounded-pill px-3" onclick="decodeBase64()">
          <i class="fas fa-lock-open me-1"></i> Decode Base64
        </button>
        <button class="btn btn-warning font-mono rounded-pill px-3 text-dark" onclick="encodeUrl()">
          <i class="fas fa-link me-1"></i> URL Encode
        </button>
        <button class="btn btn-outline-warning font-mono rounded-pill px-3" onclick="decodeUrl()">
          <i class="fas fa-unlink me-1"></i> URL Decode
        </button>
        <button class="btn btn-outline-danger font-mono rounded-pill px-3 ms-auto" onclick="clearAll()">
          <i class="fas fa-trash me-1"></i> Bersihkan
        </button>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label class="form-label text-light small font-mono mb-0">Hasil Output:</label>
          <button class="btn btn-sm btn-outline-info font-mono" onclick="copyOutput()">
            <i class="fas fa-copy me-1"></i> Salin Hasil
          </button>
        </div>
        <textarea id="outputText" class="form-control font-mono" rows="4" readonly placeholder="Hasil konversi akan tampil di sini..."></textarea>
      </div>

      <div id="statusAlert" class="font-mono small text-secondary">
        Status: Menunggu masukan teks...
      </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-muted small mt-4 pt-2 font-mono">
      &copy; 2026 Bang Mansur &bull; Rekayasa Jaringan & Keamanan Siber
    </footer>
  </div>

  <script>
    function encodeBase64() {
      try {
        const input = document.getElementById("inputText").value;
        const encoded = btoa(unescape(encodeURIComponent(input)));
        document.getElementById("outputText").value = encoded;
        setStatus("Berhasil meng-encode teks ke Base64 (UTF-8 safe).", "text-success");
      } catch (e) {
        setStatus("Error: " + e.message, "text-danger");
      }
    }

    function decodeBase64() {
      try {
        const input = document.getElementById("inputText").value.trim();
        const decoded = decodeURIComponent(escape(atob(input)));
        document.getElementById("outputText").value = decoded;
        setStatus("Berhasil men-decode Base64 ke teks asli.", "text-success");
      } catch (e) {
        setStatus("Error: Format Base64 tidak valid.", "text-danger");
      }
    }

    function encodeUrl() {
      const input = document.getElementById("inputText").value;
      document.getElementById("outputText").value = encodeURIComponent(input);
      setStatus("Berhasil meng-encode URL parameter.", "text-success");
    }

    function decodeUrl() {
      try {
        const input = document.getElementById("inputText").value;
        document.getElementById("outputText").value = decodeURIComponent(input);
        setStatus("Berhasil men-decode URL parameter.", "text-success");
      } catch (e) {
        setStatus("Error: Format URL encoding tidak valid.", "text-danger");
      }
    }

    function clearAll() {
      document.getElementById("inputText").value = "";
      document.getElementById("outputText").value = "";
      setStatus("Input dan output telah dibersihkan.", "text-secondary");
    }

    function copyOutput() {
      const output = document.getElementById("outputText").value;
      if (output) {
        navigator.clipboard.writeText(output);
        setStatus("Hasil berhasil disalin ke clipboard!", "text-info");
      }
    }

    function setStatus(msg, cls) {
      const el = document.getElementById("statusAlert");
      el.className = "font-mono small " + cls;
      el.innerText = "Status: " + msg;
    }
  </script>
</body>
</html>
